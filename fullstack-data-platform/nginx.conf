server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # Assuming backend runs on port 8000 and is reachable at 'backend' hostname in Docker Compose
    # This block assumes the backend is reachable at the hostname 'backend' in
    # containerized deployments (Docker / Kubernetes). Adjust proxy_pass as needed.
    # For now, we just prepare the block.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
