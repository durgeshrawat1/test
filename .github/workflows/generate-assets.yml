name: Generate Logos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: fullstack-data-platform
        run: npm ci

      - name: Generate logos
        working-directory: fullstack-data-platform
        run: npm run generate-logos

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fullstack-data-platform/public/logo-bank.png fullstack-data-platform/public/logo-bank-dark.png || true
          git commit -m "chore: regenerate logos" || echo "no changes to commit"
          git push origin HEAD:main || echo "push failed"
